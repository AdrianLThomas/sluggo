<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sluggo!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 1rem;
            font-size: 2rem;
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        iframe {
            width: 1024px;
            height: 768px;
            max-width: 100vw;
            max-height: 80vh;
            border: none;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <h1>Sluggo!</h1>
    <iframe src="main.html" width="1024" height="768" allow="autoplay"></iframe>
</body>
</html>
